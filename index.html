<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Trading Journal</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="style.css"/>
</head>
<body>

<!-- Login overlay -->
<div class="login-overlay" id="login-overlay">
  <div class="login-box">
    <div class="login-title">Trading Journal</div>
    <div class="login-sub">Přihlaste se pro přístup</div>
    <input class="login-inp" type="text" id="login-user" placeholder="Uživatelské jméno" autocomplete="username"/>
    <input class="login-inp" type="password" id="login-pass" placeholder="Heslo" autocomplete="current-password"/>
    <div class="login-err" id="login-err"></div>
    <button class="login-btn" id="login-btn">Přihlásit se</button>
  </div>
</div>

<div class="shell" id="shell" style="display:none">
  <!-- Top bar -->
  <div class="topbar">
    <div class="logo-name">Trading Journal</div>
    <div class="topbar-tabs">
      <button class="topbar-tab active" id="tab-calendar">Kalendář</button>
      <button class="topbar-tab" id="tab-stats">Statistiky</button>
    </div>
    <div class="topbar-right">
    <button class="settings-btn" id="settings-btn" title="Nastavení">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
    <div class="user-btn-wrap">
      <button class="user-btn" id="user-btn"></button>
      <div class="user-dropdown" id="user-dropdown">
        <div class="user-dd-avatar" id="user-dd-avatar"></div>
        <div class="user-dd-name" id="user-dd-name"></div>
        <div class="user-dd-sep"></div>
        <div class="user-dd-row"><span class="user-dd-lbl">Přihlášen od</span><span class="user-dd-val" id="user-dd-since"></span></div>
        <div class="user-dd-row"><span class="user-dd-lbl">Obchodů celkem</span><span class="user-dd-val" id="user-dd-trades"></span></div>
        <div class="user-dd-row"><span class="user-dd-lbl">Win rate</span><span class="user-dd-val" id="user-dd-wr"></span></div>
        <div class="user-dd-sep"></div>
        <button class="user-dd-logout" id="user-dd-logout">Odhlásit se</button>
      </div>
    </div>
    </div>
  </div>

  <!-- Settings panel -->
  <div class="settings-overlay" id="settings-overlay">
    <div class="settings-panel" id="settings-panel">
      <div class="settings-head">
        <div class="settings-title">Nastavení</div>
        <button class="settings-x" id="settings-x">✕</button>
      </div>
      <div class="settings-body">
        <div class="settings-section-title">Zobrazení</div>
        <div class="settings-options" id="mode-opts">
          <button class="settings-opt" data-val="both">RR + $</button>
          <button class="settings-opt" data-val="rr">Jen RR</button>
          <button class="settings-opt" data-val="pnl">Jen $</button>
        </div>
        <div class="settings-section-title" style="margin-top:16px">Měna</div>
        <div class="settings-options" id="currency-opts">
          <button class="settings-opt" data-val="usd">$ USD</button>
          <button class="settings-opt" data-val="eur">€ EUR</button>
          <button class="settings-opt" data-val="czk">Kč CZK</button>
        </div>
      </div>
    </div>
  </div>

  <div class="body">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar"></aside>

    <!-- Calendar view -->
    <div class="cal-wrap" id="view-calendar">
      <div class="cal-nav">
        <button class="nav-btn" id="prev">&#8592;</button>
        <div class="month-label" id="month-label"></div>
        <button class="nav-btn" id="next">&#8594;</button>
      </div>
      <div class="cal-inner">
        <div class="day-names" id="day-names"></div>
        <div class="cal-grid" id="cal-grid"></div>
      </div>
      <div class="anim-ctrl-wrap">
        <button class="anim-ctrl-toggle" id="anim-ctrl-toggle">✦ Animace</button>
      </div>
      <div class="anim-ctrl-panel" id="anim-ctrl-panel">
        <div class="anim-ctrl-group">
          <div class="anim-ctrl-label">Rychlost</div>
          <div class="anim-ctrl-row">
            <input type="range" class="anim-speed-slider" id="anim-speed" min="2" max="40" step="1" value="10"/>
            <span class="anim-speed-val" id="anim-speed-val">10s</span>
          </div>
        </div>
        <div class="anim-ctrl-group">
          <div class="anim-ctrl-label">Barva</div>
          <div class="anim-ctrl-row" id="anim-colors"></div>
        </div>
        <div class="anim-ctrl-group">
          <div class="anim-ctrl-label">Počet jisker</div>
          <div class="anim-ctrl-row" id="anim-counts"></div>
        </div>
        <div class="anim-ctrl-group">
          <div class="anim-ctrl-label">Zapnout</div>
          <div class="anim-ctrl-row">
            <button class="anim-toggle-btn active" id="anim-onoff">Zap</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Stats view -->
    <div class="stats-wrap" id="view-stats" style="display:none">
      <div class="stats-inner" id="stats-inner"></div>
    </div>

  </div>
</div>

<!-- Modal -->
<div class="overlay" id="overlay">
  <div class="modal" id="modal">
    <div class="modal-head">
      <div class="modal-date" id="modal-date"></div>
      <button class="modal-x" id="modal-x">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightbox-close">✕</button>
  <button class="lb-nav lb-prev" id="lb-prev"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></button>
  <button class="lb-nav lb-next" id="lb-next"><svg viewBox="0 0 24 24"><polyline points="9 6 15 12 9 18"/></svg></button>
  <div class="lb-counter" id="lb-counter"></div>
  <div class="lightbox-inner">
    <img id="lightbox-img" src="" alt=""/>
    <div class="lightbox-side">
      <div class="lightbox-tf-label" id="lightbox-label"></div>
      <div class="lightbox-notes" id="lightbox-notes"></div>
    </div>
  </div>
</div>

<!-- Trades list -->
<div class="tl-overlay" id="tl-overlay">
  <div class="tl-modal">
    <div class="tl-head">
      <div class="tl-title" id="tl-title"></div>
      <button class="tl-x" id="tl-x">✕</button>
    </div>
    <div class="tl-list" id="tl-list"></div>
  </div>
</div>

<!-- Custom range picker -->
<div class="cr-overlay" id="cr-overlay">
  <div class="cr-modal">
    <div class="cr-head">
      <div class="cr-title" id="cr-title">Vyberte období</div>
      <button class="cr-x" id="cr-x">✕</button>
    </div>
    <div class="cr-cal-wrap">
      <div class="cr-cal-nav">
        <button class="cr-nav-btn" id="cr-prev">&#8592;</button>
        <div class="cr-cal-label" id="cr-cal-label"></div>
        <button class="cr-nav-btn" id="cr-next">&#8594;</button>
      </div>
      <div class="cr-day-names"></div>
      <div class="cr-grid" id="cr-grid"></div>
    </div>
    <div class="cr-sel-bar" id="cr-sel-bar">Klikněte na začáteční datum</div>
    <div class="cr-footer">
      <button class="cr-btn" id="cr-cancel">Zrušit</button>
      <button class="cr-btn primary" id="cr-apply" disabled>Použít</button>
    </div>
  </div>
</div>

<!-- Overview -->
<div class="overview-overlay" id="overview-overlay">
  <div class="overview-panel">
    <div class="overview-head">
      <div class="overview-title">Přehled screenshotů</div>
      <button class="overview-close" id="overview-close">✕</button>
    </div>
    <div class="overview-grid" id="overview-grid"></div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast">Saved ✓</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="app.js"></script>
</body>
</html>
